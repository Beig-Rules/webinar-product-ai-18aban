<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>وبینار رشد محصول با AI</title>
<style>
:root{--bg:#000;--fg:#fff;--accent:#ff3b30}
body.light{--bg:#fff;--fg:#000;--accent:#ff3b30}
body{font-family:Vazirmatn,sans-serif;background:var(--bg);color:var(--fg);margin:0;text-align:center}
.hero{padding:100px 20px}
.date{font-size:1.5rem;color:var(--accent);margin:20px}
.btn{background:var(--accent);color:#fff;padding:16px 40px;border-radius:8px;text-decoration:none;font-weight:bold;display:inline-block}
.agenda{max-width:600px;margin:40px auto;text-align:right;padding:0 20px}
</style>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn&display=swap" rel="stylesheet">
</head>
<body>
<button style="position:absolute;top:20px;left:20px" onclick="document.body.classList.toggle('light')">تم</button>
<section class="hero">
<h1>رشد محصول با هوش مصنوعی</h1>
<p>وبینار رایگان برای مدیران محصول</p>
<div class="date">۲۵ آبان ۱۴۰۵ — ساعت ۱۸:۰۰</div>
<a href="#" class="btn">ثبت‌نام رایگان</a>
</section>
<section class="agenda">
<h2>سرفصل</h2>
<ul>
<li>معرفی ابزارهای AI مناسب تیم محصول</li>
<li>موارد واقعی رشد</li>
<li>پرسش و پاسخ</li>
</ul>
</section>
</body>
</html>
